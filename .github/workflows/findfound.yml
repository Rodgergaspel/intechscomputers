name: Build and publish Find & Found
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: findfound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Make the site findable on Google
        run: |
          SITE="${{ steps.pages.outputs.base_url }}/"
          sed -i "s#__SITE__#${SITE}#g" www/index.html
          printf 'User-agent: *\nAllow: /\nSitemap: %ssitemap.xml\n' "$SITE" > www/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>%s</loc><changefreq>daily</changefreq><priority>1.0</priority></url></urlset>\n' "$SITE" > www/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Use the Android SDK already on the runner
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV && echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Location and camera permissions
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          npm install --no-save @capacitor/assets@3 --no-audit --no-fund
          mkdir -p assets && cp resources/icon.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#1650C8' || echo "icon step skipped"
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/FindFound-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/FindFound-Android.apk }

  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Open the live website inside the app when it exists
        shell: bash
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          if curl -sfI "$URL" >/dev/null; then echo "{ \"url\": \"$URL\" }" > electron/site.json; fi
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*.exe' }

  release:
    name: Download page (GitHub Release)
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Find & Found 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `FindFound-Android.apk`, open it, and allow "Install from this source" when asked.
            **Windows:** download `FindFound-Setup-…exe` (installs with a Start-menu icon) or `FindFound-Portable-…exe` (runs without installing). If Windows SmartScreen appears, choose *More info → Run anyway*.
            **iPhone / iPad:** open the website in Safari → Share → *Add to Home Screen*.
          files: out/*

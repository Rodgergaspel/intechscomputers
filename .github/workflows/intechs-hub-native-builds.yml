name: Intechs Hub Native Builds
on:
  push:
    branches:
      - intechs-hub-native-builds
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android APK (test build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intechs-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: intechs-hub/android
      - uses: actions/upload-artifact@v4
        with:
          name: Intechs-Android-APK-test
          path: intechs-hub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  macos:
    name: macOS DMG (development build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: intechs-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx electron-builder --mac dmg --arm64 --x64 --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Intechs-macOS-DMG-development
          path: intechs-hub/release/*.dmg
          if-no-files-found: error
  ios:
    name: iOS unsigned device build
    runs-on: macos-15
    defaults:
      run:
        working-directory: intechs-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Intechs-iOS-unsigned-app
          path: intechs-hub/build-ios/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error
